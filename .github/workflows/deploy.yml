name: Deploy to cPanel hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-hosting
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and upload production site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Validate FTP deployment settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || vars.FTP_SERVER_DIR }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. Add it in GitHub Settings → Secrets and variables → Actions."
              missing=1
            else
              echo "$name is set."
            fi
          done
          exit "$missing"

      - name: Normalize FTP target folder
        env:
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || vars.FTP_SERVER_DIR }}
        run: |
          target_dir="$FTP_SERVER_DIR"
          if [ -z "$target_dir" ]; then
            target_dir="/"
          fi
          case "$target_dir" in
            */) ;;
            *) target_dir="$target_dir/" ;;
          esac
          echo "FTP_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
          echo "Deploying to FTP folder: $target_dir"

      - name: Upload dist to cPanel public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || vars.FTP_SERVER_DIR }}
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ env.FTP_TARGET_DIR }}
          dangerous-clean-slate: false
