name: Deploy to cPanel hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-hosting
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy via cPanel API
    runs-on: ubuntu-latest

    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST || vars.CPANEL_HOST }}
      CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME || vars.CPANEL_USERNAME }}
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      CPANEL_TARGET_DIR: ${{ secrets.CPANEL_TARGET_DIR || vars.CPANEL_TARGET_DIR || 'public_html' }}
      DEPLOY_ARCHIVE: __gsl_deploy.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Validate cPanel deployment settings
        run: |
          missing=0
          for name in CPANEL_HOST CPANEL_USERNAME CPANEL_TOKEN CPANEL_TARGET_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. Add it in GitHub Settings → Secrets and variables → Actions."
              missing=1
            else
              echo "$name is set."
            fi
          done
          exit "$missing"

      - name: Create deployment archive
        run: |
          rm -f "$DEPLOY_ARCHIVE"
          cd dist
          zip -r "../$DEPLOY_ARCHIVE" .
          cd ..
          ls -lh "$DEPLOY_ARCHIVE"

      - name: Upload archive through cPanel API
        run: |
          curl -k -sS --fail \
            -H "Authorization: cpanel ${CPANEL_USERNAME}:${CPANEL_TOKEN}" \
            -F "dir=${CPANEL_TARGET_DIR}" \
            -F "file=@${DEPLOY_ARCHIVE};filename=${DEPLOY_ARCHIVE}" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/upload_files" \
            -o upload-response.json

          node - <<'NODE'
          const fs = require('fs');
          const response = JSON.parse(fs.readFileSync('upload-response.json', 'utf8'));
          console.log(JSON.stringify(response, null, 2));
          if (!response.result || response.result.status !== 1) {
            throw new Error('cPanel upload failed');
          }
          NODE

      - name: Extract archive into public website folder
        run: |
          curl -k -sS --fail -G \
            -H "Authorization: cpanel ${CPANEL_USERNAME}:${CPANEL_TOKEN}" \
            "https://${CPANEL_HOST}:2083/json-api/cpanel" \
            --data-urlencode "cpanel_jsonapi_user=${CPANEL_USERNAME}" \
            --data-urlencode "cpanel_jsonapi_apiversion=2" \
            --data-urlencode "cpanel_jsonapi_module=Fileman" \
            --data-urlencode "cpanel_jsonapi_func=fileop" \
            --data-urlencode "op=extract" \
            --data-urlencode "sourcefiles=${CPANEL_TARGET_DIR}/${DEPLOY_ARCHIVE}" \
            --data-urlencode "destfiles=${CPANEL_TARGET_DIR}" \
            --data-urlencode "doubledecode=1" \
            -o extract-response.json

          node - <<'NODE'
          const fs = require('fs');
          const response = JSON.parse(fs.readFileSync('extract-response.json', 'utf8'));
          console.log(JSON.stringify(response, null, 2));
          if (!response.cpanelresult || response.cpanelresult.event?.result !== 1) {
            throw new Error('cPanel archive extraction failed');
          }
          NODE

      - name: Remove deployment archive from server
        if: always()
        run: |
          curl -k -sS -G \
            -H "Authorization: cpanel ${CPANEL_USERNAME}:${CPANEL_TOKEN}" \
            "https://${CPANEL_HOST}:2083/json-api/cpanel" \
            --data-urlencode "cpanel_jsonapi_user=${CPANEL_USERNAME}" \
            --data-urlencode "cpanel_jsonapi_apiversion=2" \
            --data-urlencode "cpanel_jsonapi_module=Fileman" \
            --data-urlencode "cpanel_jsonapi_func=fileop" \
            --data-urlencode "op=trash" \
            --data-urlencode "sourcefiles=${CPANEL_TARGET_DIR}/${DEPLOY_ARCHIVE}" \
            --data-urlencode "doubledecode=1" \
            -o cleanup-response.json || true
